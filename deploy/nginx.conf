# TalentLens behind Nginx — reverse proxy for a real deployment.
#
# Not part of `docker compose up`; this is the reference config for putting the app on a
# server with one hostname and TLS. Run it alongside the compose stack, or add it as a
# service with this file mounted at /etc/nginx/conf.d/default.conf.
#
#   /           -> the API container, which also serves the console HTML
#   /dashboard/ -> the Streamlit container (needs WebSocket upgrade headers)
#
# Also: TLS termination, a request-size cap matching the app's own 8 MB upload limit,
# gzip for the ~290 KB single-file console, and a rate limit on the login endpoint.

upstream talentlens_api       { server api:8000; }
upstream talentlens_dashboard { server dashboard:8501; }

# limit login attempts per IP — the app hashes passwords at 260k PBKDF2 iterations, so
# unthrottled attempts are expensive for the server, not just for the attacker
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # uncomment once certificates are in place, and serve on 443 instead
    # return 301 https://$host$request_uri;

    client_max_body_size 8m;          # matches MAX_BYTES in app/main.py

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff      always;
    add_header X-Frame-Options        SAMEORIGIN   always;
    add_header Referrer-Policy        same-origin  always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://talentlens_api;
        include /etc/nginx/proxy_params_talentlens;
    }

    location /dashboard/ {
        proxy_pass http://talentlens_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # Streamlit is WebSocket-based
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        include /etc/nginx/proxy_params_talentlens;
    }

    location / {
        proxy_pass http://talentlens_api;
        include /etc/nginx/proxy_params_talentlens;
    }
}
